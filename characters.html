<script>
(() => {
  /* キャラクターのデータ（ゲームのプロフィールと同じ） */
  const CH = [
    {k: "kineko", tab: "気猫", grp: "OWARAI SISTERS", name: "日向気猫", ruby: "ひなた きねこ", en: "KINEKO HINATA", role: "司会・盛り上げ担当", copy: "笑いの日本一、目指すでー！", c1: "#f4b400", c2: "#ff6a3d",
      stat: [["年齢", "15歳"], ["性格", "明るく元気なムードメーカー"], ["得意なお笑い", "一発ギャグ・司会のフリ"], ["趣味", "カラオケ・マイク集め"], ["苦手なもの", "シーンとした空気", 1]]},
    {k: "aoi", tab: "葵", grp: "OWARAI SISTERS", name: "水野葵", ruby: "みずの あおい", en: "AOI MIZUNO", role: "クールなツッコミ担当", copy: "ツッコミは、うちに任しとき。", c1: "#2f7fe0", c2: "#16b3c8",
      stat: [["年齢", "16歳"], ["性格", "クールだけど涙もろい"], ["得意なお笑い", "ツッコミ・しゃべくり漫才"], ["趣味", "昔の漫才の映像を見る"], ["苦手なもの", "早起き", 1]]},
    {k: "momoe", tab: "百萌", grp: "OWARAI SISTERS", name: "桜川百萌", ruby: "さくらがわ ももえ", en: "MOMOE SAKURAGAWA", role: "天然ボケ担当", copy: "ほな、みんなで行こか〜", c1: "#e8558f", c2: "#ff9ec4",
      stat: [["年齢", "17歳"], ["性格", "おっとり天然のほめ上手"], ["得意なお笑い", "天然ボケ・一発ギャグ"], ["趣味", "和菓子作り・お昼寝"], ["苦手なもの", "急かされること", 1]]}
  ];
  const $ = s => document.querySelector(s);
  const cs = $("#cs"), tabs = $(".cs-tabs"), frame = $(".cs-frame"), thumbs = $(".cs-thumbs"), info = $(".cs-info"), en = $(".cs-en");
  const art = (c, j) => `assets/img/ch_${c.k}_${j + 1}.webp`;
  let cur = -1, pic = 0;

  tabs.innerHTML = CH.map((c, i) => `<button class="cs-tab" type="button" role="tab" id="tab-${c.k}" aria-selected="false" style="--tc:${c.c1}" data-i="${i}">${i === 0 ? `<em class="grp">SISTERS</em>` : ""}<img src="assets/img/face_${c.k}.webp" alt="" width="220" height="220"><span>${c.tab}</span></button>`).join("");
  document.querySelector(".cs-cards").innerHTML = CH.map((c, i) => `<a class="cs-card rv d${i % 4}" href="#${c.k}" style="--cc:${c.c1}"><img src="${art(c, 0)}" alt="" loading="lazy"><span><small>${c.role}</small><b>${c.name}</b></span></a>`).join("");

  const setArt = (src, anim = true) => {
    const old = frame.querySelector("img:not(.out)");
    const im = new Image(); im.src = src; im.alt = ""; im.decoding = "async";
    if (anim) im.className = "in";
    frame.append(im);
    if (old) { old.classList.add("out"); setTimeout(() => old.remove(), 500); }
  };
  const show = (i, push = true) => {
    i = (i + CH.length) % CH.length; if (i === cur) return; cur = i; pic = 0; vi = 0; if (vau) vau.pause();
    const c = CH[i];
    cs.style.setProperty("--c1", c.c1); cs.style.setProperty("--c2", c.c2);
    en.textContent = c.en;
    tabs.querySelectorAll(".cs-tab").forEach(t => t.setAttribute("aria-selected", +t.dataset.i === i));
    info.setAttribute("aria-labelledby", "tab-" + c.k);
    setArt(art(c, 0));
    thumbs.innerHTML = [0, 1, 2].map(j => `<button class="cs-th" type="button" aria-pressed="${j === 0}" aria-label="絵 ${j + 1}" data-j="${j}"><img src="${art(c, j)}" alt="" loading="lazy"></button>`).join("");
    info.classList.remove("cs-fx"); void info.offsetWidth;
    info.innerHTML = `<p class="cs-count"><b>0${i + 1}</b> / 0${CH.length}</p>
      <span class="cs-grp">${c.grp}</span>
      <span class="cs-ruby">${c.ruby}</span>
      <h2 class="cs-name">${[...c.name].map((ch, n) => `<span style="animation-delay:${n * .06}s">${ch}</span>`).join("")}</h2>
      <span class="cs-enname">${c.en}</span>
      <span class="cs-role">${c.role}</span>
      <div class="cs-voice"><p class="cs-quote">「${c.copy}」</p><button type="button" class="cs-vo" aria-label="${c.name}の声を聞く"><i class="vo-ic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 010 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></i><span>ボイス</span></button></div>
      <dl class="cs-stat">${c.stat.map(([a, b, w]) => `<div${w ? ' class="wide"' : ""}><dt>${a}</dt><dd>${b}</dd></div>`).join("")}</dl>`;
    info.classList.add("cs-fx");
    if (push) history.replaceState(null, "", "#" + c.k);
  };
  /* ボイス：押すたびに順番にちがうセリフ */
  const VO = ["intro", "high1", "win", "pass1"]; let vi = 0, vau = null;
  info.addEventListener("click", e => { const b = e.target.closest(".cs-vo"); if (!b) return;
    if (vau) { vau.pause(); }
    vau = new Audio(`assets/vo/${CH[cur].k}_${VO[vi++ % VO.length]}.mp3`); vau.volume = .9;
    b.classList.add("on"); vau.onended = vau.onpause = () => b.classList.remove("on");
    vau.play().catch(() => b.classList.remove("on")); });
  tabs.addEventListener("click", e => { const b = e.target.closest(".cs-tab"); if (b) show(+b.dataset.i); });
  tabs.addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "ArrowDown") { e.preventDefault(); show(cur + 1); tabs.querySelector('[aria-selected="true"]').focus(); } if (e.key === "ArrowLeft" || e.key === "ArrowUp") { e.preventDefault(); show(cur - 1); tabs.querySelector('[aria-selected="true"]').focus(); } });
  thumbs.addEventListener("click", e => { const b = e.target.closest(".cs-th"); if (!b || +b.dataset.j === pic) return; pic = +b.dataset.j; thumbs.querySelectorAll(".cs-th").forEach(t => t.setAttribute("aria-pressed", t === b)); setArt(art(CH[cur], pic)); });
  $(".cs-nav .prev").onclick = () => show(cur - 1);
  $(".cs-nav .next").onclick = () => show(cur + 1);
  /* スワイプ */
  let sx = null;
  frame.parentElement.addEventListener("pointerdown", e => { if (!e.target.closest("button")) sx = e.clientX; });
  addEventListener("pointerup", e => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 50) show(cur + (dx < 0 ? 1 : -1)); });
  const fromHash = () => { const k = location.hash.slice(1), i = CH.findIndex(c => c.k === k); show(i < 0 ? 0 : i, false); if (i >= 0 && scrollY > 200) scrollTo({top: 0, behavior: "smooth"}); };
  addEventListener("hashchange", fromHash);
  fromHash();
  watchReveal();
})();
</script>
