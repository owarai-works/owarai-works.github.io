<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お知らせ｜お笑い道場 なんでやねん 公式サイト</title>
<meta name="description" content="「お笑い道場 なんでやねん」の最新のお知らせ・アップデート・イベント情報。">
<meta name="theme-color" content="#ffc61a">
<meta property="og:type" content="article">
<meta property="og:title" content="お知らせ｜お笑い道場 なんでやねん 公式サイト">
<meta property="og:image" content="assets/img/ogp.jpg">
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/pop.css">
</head>
<body data-page="news">
<main>
  <header class="ph">
    <i class="ph-bg" style="background-image:url(assets/img/wp_area4.webp)"></i>
    <div class="wrap">
      <nav class="crumb" aria-label="現在地"><a href="index.html">HOME</a><span>NEWS</span></nav>
      <span class="en" aria-hidden="true">NEWS</span>
      <h1>お知らせ</h1>
      <p>アップデート・イベント・メンテナンスなどの最新情報をお届けします。</p>
    </div>
  </header>
  <section class="sec" style="padding-top:50px">
    <div class="wrap">
      <div class="nf" role="group" aria-label="種類でしぼりこむ"></div>
      <div class="news-list" id="nl"></div>
    </div>
  </section>
</main>
<script src="assets/js/news-data.js"></script>
<script src="assets/js/site.js"></script>
<script>
(() => {
  const nf = document.querySelector(".nf"), nl = document.getElementById("nl");
  const kinds = [["all", "すべて"], ...Object.entries(NEWS_TAG).filter(([k]) => NEWS.some(n => n.tag === k))];
  let cur = new URLSearchParams(location.search).get("tag") || "all";
  const draw = () => {
    nf.innerHTML = kinds.map(([k, v]) => `<button type="button" data-k="${k}" aria-pressed="${k === cur}">${v}</button>`).join("");
    const list = NEWS.filter(n => cur === "all" || n.tag === cur);
    nl.innerHTML = list.length ? list.map(newsItemHTML).join("") : '<p class="news-empty">お知らせはまだありません。</p>';
    watchReveal(nl);
  };
  nf.addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; cur = b.dataset.k; history.replaceState(null, "", cur === "all" ? "news.html" : "?tag=" + cur); draw(); });
  draw();
})();
</script>
</body>
</html>
