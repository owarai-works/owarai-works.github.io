<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>お知らせ｜お笑い道場 なんでやねん 公式サイト</title>
<meta name="description" content="「お笑い道場 なんでやねん」のお知らせ。">
<meta name="theme-color" content="#ffc61a">
<meta property="og:type" content="article">
<meta property="og:title" content="お知らせ｜お笑い道場 なんでやねん 公式サイト">
<meta property="og:image" content="assets/img/ogp.jpg">
<link rel="icon" href="assets/img/favicon.png">
<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Dela+Gothic+One&family=Shippori+Mincho+B1:wght@700;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<link rel="stylesheet" href="assets/css/pop.css">
</head>
<body data-page="news">
<main>
  <div class="wrap" style="padding-top:calc(var(--hd) + 30px)">
    <nav class="crumb" aria-label="現在地"><a href="index.html">HOME</a><span><a href="news.html">NEWS</a></span><span id="cr">記事</span></nav>
    <article class="art" id="art"></article>
  </div>
</main>
<script src="assets/js/news-data.js"></script>
<script src="assets/js/site.js"></script>
<script src="assets/js/sfx.js" defer></script>
<script src="assets/js/faq-bot.js" defer></script>
<script>
(() => {
  const id = new URLSearchParams(location.search).get("id"), i = NEWS.findIndex(n => n.id === id), el = document.getElementById("art");
  if (i < 0) { el.innerHTML = '<h1>お知らせが見つかりません</h1><p class="art-body">アドレスが変わったか、削除された可能性があります。</p><div class="art-pager"><span></span><a class="ls" href="news.html">お知らせ一覧へ</a><span></span></div>'; return; }
  const n = NEWS[i], nw = NEWS[i - 1], od = NEWS[i + 1];
  document.title = n.title + "｜お笑い道場 なんでやねん 公式サイト";
  document.getElementById("cr").textContent = n.date;
  el.innerHTML = `<div class="art-meta"><time datetime="${n.date.replace(/\./g, "-")}">${n.date}</time><span class="tag ${n.tag}">${NEWS_TAG[n.tag] || "お知らせ"}</span></div>
    <h1>${n.title}</h1>
    ${n.img ? `<figure class="art-img"><img src="${n.img}" alt=""${n.pos ? ` style="object-position:${n.pos}"` : ""}></figure>` : ""}
    <div class="art-body">${n.body}</div>
    <nav class="art-pager" aria-label="ほかのお知らせ">
      ${od ? `<a href="article.html?id=${od.id}"><small>← PREV</small>${od.title}</a>` : "<span></span>"}
      <a class="ls" href="news.html">一覧へ戻る</a>
      ${nw ? `<a class="nx" href="article.html?id=${nw.id}"><small>NEXT →</small>${nw.title}</a>` : "<span></span>"}
    </nav>`;
})();
</script>
</body>
</html>
